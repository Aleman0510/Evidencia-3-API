spring.application.name=composite-api-demo
server.port=8080

# Base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/ecommerce_db
spring.datasource.username=postgres
spring.datasource.password=admin

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Carga de datos de prueba (data.sql) despues de crear las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Composite API: URL de los microservicios propios y de la API externa
microservices.base-url=http://localhost:8080
exchange.api.base-url=https://api.frankfurter.dev

# Timeouts (resiliencia)
http.client.connect-timeout-ms=2000
http.client.read-timeout-ms=3000